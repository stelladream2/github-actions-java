name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
         java-version: '17'
         distribution: 'corretto'
         cache: maven

    - name: Build & test with Maven
      run: mvn --batch-mode package

    - name: Run JAR
      run: java -jar target/*.jar 10
